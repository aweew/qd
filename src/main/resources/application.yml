# 服务配置
server:
  port:
    6001
  servlet:
    context-path: /foundation

# spring 配置
spring:
  application:
    name: foundation
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    hikari:
      maximum-pool-size: 20
      idle-timeout: 10000
    url: jdbc:p6spy:mysql://119.3.87.115:3306/ld_test?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true
    username: root
    password: 2wsx@WSX
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver

# mybatis-plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.awe.foundation.manager.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID
      # 逻辑删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Swagger3 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tagsSorter: alpha
    use-root-path: true
  cache:
    disabled: true

# 日志
logging:
  level:
    org.springframework: warn
    com.awe: debug
  config: classpath:logback-spring.xml

# 全局线程池相关配置
thread-pool:
  # 是否开启线程池
  enabled: true
  # 队列最大长度
  queueCapacity: 128
  # 线程池维护线程所允许的空闲时间
  keepAliveSeconds: 300

# MySQL 表结构 DDL 监听（基于 Binlog）
ddl-monitor:
  # 是否开启 DDL 监听
  enabled: true
  # Binlog 客户端 serverId，同一 MySQL 实例下需唯一
  server-id: 5642
  # 仅监听指定库（多库）；为空则自动取 spring.datasource.url 中的库名
  databases:
    - ld_test
    - ydd_test
    - ydd
    - ydd2
    - ydd3
  # 连接超时（毫秒）
  connect-timeout: 10000
  # 心跳间隔（毫秒）
  keepalive-interval: 15000
  # 钉钉自定义机器人通知
  dingtalk:
    # 是否开启钉钉通知
    enabled: true
    # 钉钉机器人 Webhook 地址，例如 https://oapi.dingtalk.com/robot/send?access_token=xxx
    webhook-url: https://oapi.dingtalk.com/robot/send?access_token=f036e267295363fc853efe21ada9abf98c2ab3fbe2683b59193f7c217851a8c5
    # 钉钉机器人加签密钥
    secret: SECda46be299cc735ffc48f6f3cef1b5824a1c3ab5d70b78c2058e3e89a25c5c246

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # jwt 签名密钥
  jwt-secret-key: rtFDdiyVAjM8EYqwNgbS
  # 是否输出操作日志
  is-log: true
